version: '3.8'

services:
  attendance-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twite-attendance-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=twite_ai_production_jwt_secret_2026
    volumes:
      - db_data:/app/backend/data
    restart: always

volumes:
  db_data:
